[project]
name = "residual-alpha"
version = "0.1.0"
description = "Evaluation harness for time-series foundation models on cross-sectional equity returns"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyarrow>=12.0",
  "pyyaml>=6.0",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
# TimesFM-3 itself. Install from a clone of google-research/timesfm:
#   pip install -e '/path/to/timesfm[torch]'
# The weights are released for non-commercial, non-production use only.
timesfm = ["torch>=2.0"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.0"]

[project.scripts]
ralpha = "ralpha.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 88
indent-width = 2
